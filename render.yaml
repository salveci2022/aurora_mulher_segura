services:
  - type: web
    name: aurora-mulher-segura
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER_DATA_DIR
        value: /var/data
    disk:
      name: aurora-data
      mountPath: /var/data
      sizeGB: 1
