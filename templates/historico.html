<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0014">
    <title>Histórico · Aurora</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="aurora-bg">
        <div class="center-wrap">
            <div class="aurora-card">
                <div class="topbar">
                    <div class="brand">
                        <div class="brand-dot">📜</div>
                        <div>
                            <div class="brand-title">AURORA</div>
                            <div class="brand-sub">Histórico de Alertas</div>
                        </div>
                    </div>
                    <div class="top-actions">
                        <a href="/panic" class="pill">🚨 SOS</a>
                        <a href="/" class="pill">← Voltar</a>
                    </div>
                </div>

                <div class="content">
                    <h1 class="h1">📜 HISTÓRICO</h1>
                    <p class="center muted">Seus alertas enviados</p>

                    {% if alerts %}
                        <div class="list" style="margin-top: 16px;">
                        {% for a in alerts %}
                            <div class="pill" style="text-align:left; padding:12px 14px;">
                                <div style="font-weight:900; font-size:13px;">#{{ a.id }} — {{ a.situation }}</div>
                                <div class="muted small" style="margin-top:4px;">{{ a.ts }}</div>
                            </div>
                        {% endfor %}
                        </div>
                    {% else %}
                        <p class="center muted small" style="margin-top:24px;">Nenhum alerta registrado ainda.</p>
                    {% endif %}

                    <div class="list" style="margin-top: 20px;">
                        <a href="/panic" class="link">🚨 Botão de Pânico</a>
                        <a href="/" class="link">← Voltar ao início</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
