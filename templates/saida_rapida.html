<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Previsão do Tempo</title>
    <style>
        body { margin:0; font-family: system-ui, sans-serif; background:#f5f7fa; color:#1a1a2e; }
        .wrap { max-width:480px; margin:0 auto; padding:24px 16px; }
        h1 { font-size:20px; }
        .card { background:#fff; border-radius:12px; padding:16px; margin-top:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>☀️ Previsão do Tempo</h1>
        <div class="card">
            <p>Hoje: 24°C, parcialmente nublado.</p>
        </div>
        <div class="card">
            <p>Amanhã: 22°C, chuva fraca no período da tarde.</p>
        </div>
    </div>
</body>
</html>
