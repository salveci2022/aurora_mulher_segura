<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0014">
    <title>Alterar Senha · Aurora</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="aurora-bg">
        <div class="center-wrap">
            <div class="aurora-card">
                <div class="topbar">
                    <div class="brand">
                        <div class="brand-dot">🔑</div>
                        <div>
                            <div class="brand-title">AURORA</div>
                            <div class="brand-sub">Alterar Senha</div>
                        </div>
                    </div>
                    <div class="top-actions">
                        <a href="/panel_trusted" class="pill">← Voltar</a>
                    </div>
                </div>

                <div class="content">
                    {% if msg %}
                    <div class="pill" style="background:rgba(76,175,80,.15); border-color:rgba(76,175,80,.4); color:#81c784; text-align:center; margin-bottom:10px;">✅ {{ msg }}</div>
                    {% endif %}
                    {% if erro %}
                    <div class="pill" style="background:rgba(244,67,54,.15); border-color:rgba(244,67,54,.4); color:#ef9a9a; text-align:center; margin-bottom:10px;">❌ {{ erro }}</div>
                    {% endif %}

                    <form method="POST">
                        <label class="label">Senha atual</label>
                        <input class="input" type="password" name="atual" required>

                        <label class="label">Nova senha</label>
                        <input class="input" type="password" name="nova" required minlength="8">

                        <button class="btn btn-primary" type="submit" style="margin-top:16px; padding:14px; border-radius:14px; width:100%;">
                            Salvar nova senha
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
